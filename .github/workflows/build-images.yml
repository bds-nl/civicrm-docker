name: Build and push images

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      civicrm_version:
        description: 'CiviCRM version to build'
        required: true
        type: string

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      fpm: ${{ steps.meta.outputs.fpm }}
      nginx: ${{ steps.meta.outputs.nginx }}
    steps:
      - name: Resolve version and image names
        id: meta
        run: |
          if [ -n "${{ inputs.civicrm_version }}" ]; then
            VERSION="${{ inputs.civicrm_version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "version=${VERSION}"
            echo "fpm=ghcr.io/${OWNER}/civicrm-fpm"
            echo "nginx=ghcr.io/${OWNER}/civicrm-nginx"
          } >> "$GITHUB_OUTPUT"

  # fpm -> nginx form a chain: fpm is the FROM for nginx, so the jobs run
  # sequentially via `needs` and nginx pulls the just-pushed multi-arch
  # manifest. fpm itself builds FROM civicrm-base:latest (see build-base.yml),
  # which is built on its own manual workflow rather than here.
  fpm:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push fpm
        uses: docker/build-push-action@v6
        with:
          context: ./civicrm
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CIVICRM_VERSION=${{ needs.meta.outputs.version }}
          tags: |
            ${{ needs.meta.outputs.fpm }}:${{ needs.meta.outputs.version }}
            ${{ needs.meta.outputs.fpm }}:latest
          cache-from: type=gha,scope=fpm
          cache-to: type=gha,scope=fpm,mode=max

  nginx:
    needs: [meta, fpm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FPM_IMAGE=${{ needs.meta.outputs.fpm }}
            CIVICRM_VERSION=${{ needs.meta.outputs.version }}
          tags: |
            ${{ needs.meta.outputs.nginx }}:${{ needs.meta.outputs.version }}
            ${{ needs.meta.outputs.nginx }}:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max
