set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $https_flag {
  default "";
  https   "on";
}

server {
  listen 8080;
  server_name localhost;
  root /var/www/html;

  client_max_body_size 64m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Allowed static extensions — anything else 404s.
  # .html is needed for Mosaico editor templates.
  location ~* \.(css|js|woff2|woff|ttf|svg|jpg|jpeg|png|gif|webp|ico|html)$ {
    expires 1d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # User uploads — serve any file type as static.
  location /public/ {
    expires 1h;
    access_log off;
    try_files $uri =404;
  }

  # The one PHP entry point.
  location = /index.php {
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS $https_flag;
    fastcgi_read_timeout 300;
    include fastcgi_params;
  }

  # Catch-all: route to /index.php WITHOUT try_files, so existing files
  # (civicrm.settings.php, composer.json, /.git/HEAD, /vendor/**, …) are never
  # served as static. Query args are preserved automatically.
  location / {
    rewrite ^ /index.php last;
  }
}
